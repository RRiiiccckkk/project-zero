[package]
name = "project-zero"
version = "0.9.8"
edition = "2021"

[dependencies]
egui = "0.29.1"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.29.1", features = ["all_loaders"] }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
md5 = "0.7"
if-addrs = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30.5", features = ["android-native-activity"] }

# --- 核心配置 ---

# 1. Android 库配置
[lib]
name = "project_zero"
crate-type = ["cdylib", "rlib"]

# 2. 🚫 [[bin]] 部分已彻底删除 🚫
# 因为我们现在使用 examples/desktop.rs 作为 PC 入口，Cargo 会自动识别。

# 3. Android 权限配置 (TOML 注入)
[package.metadata.android]
package = "com.projectzero.app"
apk_label = "Project Zero"
target_sdk_version = 33
min_sdk_version = 26
fullscreen = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[package.metadata.android.activity]
name = "android.app.NativeActivity"
label = "Project Zero"
config_changes = "orientation|keyboardHidden|screenSize"
exported = true

[[package.metadata.android.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.activity.meta_data]]
name = "android.app.lib_name"
value = "project_zero"