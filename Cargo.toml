[package]
name = "project-zero"
version = "0.3.1"
edition = "2021"

[dependencies]
# L1/L4 Network & Async
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# L2 Security
rand = "0.8"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"

# Phase 9 Hotfix: Upgrade GUI stack to fix macOS Panic
eframe = "0.29.1" 
egui = "0.29.1"

